openapi: 3.1.0
info:
  title: Entity Extraction Sample
  version: '1.0'
paths:
  /items:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        '204':
          description: Created
components:
  schemas:
    Code:
      type: string
      enum: [active, archived]
    Base:
      type: object
      required: [id]
      properties:
        id:
          type: string
          format: uuid
          description: Stable identifier
    Item:
      description: A generic item
      allOf:
        - $ref: '#/components/schemas/Base'
        - type: object
          required: [status]
          properties:
            status:
              $ref: '#/components/schemas/Code'
            score:
              type: integer
              enum: [1, 2]
            note:
              type: [string, 'null']
            detail:
              type: object
              required: [label]
              properties:
                label:
                  type: string
            children:
              type: array
              items:
                $ref: '#/components/schemas/Item'
            tags:
              type: array
              items:
                type: string

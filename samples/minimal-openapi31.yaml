openapi: 3.1.0
info:
  title: Minimal Catalog
  version: '1.0'
paths:
  /items:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: [string, 'null']
      responses:
        '204':
          description: Created
components:
  schemas:
    Item:
      type: object
      properties:
        next:
          $ref: '#/components/schemas/Item'
